<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Жесткая брутальная тень -->
    <filter id="brutal-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="small-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Фон: Фирменный неоново-лаймовый Neubrutalism -->
  <rect width="512" height="512" fill="#A3E635" />

  <!-- Декоративная брутальная рамка -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="#000000" stroke-width="8" />

  <!-- Фоновые графические акценты (паттерны и ретро-звезды) -->
  <g fill="#F0ABFC" stroke="#000000" stroke-width="4" filter="url(#small-shadow)">
    <!-- 4-конечная звезда слева сверху -->
    <path d="M 75 95 Q 75 125 45 125 Q 75 125 75 155 Q 75 125 105 125 Q 75 125 75 95 Z" />
    <!-- 4-конечная звезда справа снизу -->
    <path d="M 435 375 Q 435 400 410 400 Q 435 400 435 425 Q 435 400 460 400 Q 435 400 435 375 Z" fill="#FDE047" />
  </g>

  <!-- Декоративные круги -->
  <circle cx="430" cy="90" r="18" fill="#22D3EE" stroke="#000000" stroke-width="4" filter="url(#small-shadow)" />
  <circle cx="85" cy="420" r="14" fill="#F43F5E" stroke="#000000" stroke-width="4" filter="url(#small-shadow)" />

  <!-- ГРУППА: ОВЕЧКА -->
  <g id="sheep-character" transform="translate(0, 10)">
    
    <!-- Ножки -->
    <g stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Задние/передние ножки (брутальные бруски) -->
      <rect x="180" y="380" width="28" height="60" rx="8" fill="#18181B" filter="url(#small-shadow)" />
      <rect x="304" y="380" width="28" height="60" rx="8" fill="#18181B" filter="url(#small-shadow)" />
      <!-- Копытца акцентные -->
      <rect x="180" y="420" width="28" height="20" rx="4" fill="#F0ABFC" />
      <rect x="304" y="420" width="28" height="20" rx="4" fill="#F0ABFC" />
    </g>

    <!-- Тень туловища овечки (облако шерсти) -->
    <g filter="url(#brutal-shadow)">
      <!-- Основное облако тела -->
      <path d="
        M 170 190 
        A 45 45 0 0 1 250 160 
        A 50 50 0 0 1 340 180 
        A 45 45 0 0 1 395 240 
        A 45 45 0 0 1 405 315 
        A 45 45 0 0 1 355 385 
        A 50 50 0 0 1 260 395 
        A 48 48 0 0 1 175 385 
        A 45 45 0 0 1 120 320 
        A 45 45 0 0 1 125 240 
        A 45 45 0 0 1 170 190 Z" 
        fill="#FFFFFF" 
        stroke="#000000" 
        stroke-width="8" 
        stroke-linejoin="round" 
      />
    </g>

    <!-- Ушки (висячие, за головой) -->
    <g stroke="#000000" stroke-width="7" stroke-linejoin="round">
      <!-- Левое ухо -->
      <ellipse cx="140" cy="275" rx="38" ry="18" fill="#FDE047" transform="rotate(-25 140 275)" filter="url(#small-shadow)" />
      <!-- Правое ухо -->
      <ellipse cx="372" cy="275" rx="38" ry="18" fill="#FDE047" transform="rotate(25 372 275)" filter="url(#small-shadow)" />
    </g>

    <!-- Голова (Центральный овал мордочки) -->
    <g filter="url(#small-shadow)">
      <ellipse cx="256" cy="285" rx="76" ry="86" fill="#18181B" stroke="#000000" stroke-width="8" />
    </g>

    <!-- Глаза: Большие в стиле Neubrutalism / Аниме-поп -->
    <!-- Левый глаз -->
    <ellipse cx="225" cy="265" rx="20" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="228" cy="265" r="12" fill="#000000" />
    <circle cx="233" cy="259" r="5" fill="#FFFFFF" /> <!-- Блик -->

    <!-- Правый глаз -->
    <ellipse cx="287" cy="265" rx="20" ry="24" fill="#FFFFFF" stroke="#000000" stroke-width="5" />
    <circle cx="284" cy="265" r="12" fill="#000000" />
    <circle cx="289" cy="259" r="5" fill="#FFFFFF" /> <!-- Блик -->

    <!-- Румянец на щечках (Розовые неоновые круги) -->
    <circle cx="195" cy="305" r="12" fill="#F0ABFC" />
    <circle cx="317" cy="305" r="12" fill="#F0ABFC" />

    <!-- Носик и улыбка -->
    <polygon points="256,305 246,295 266,295" fill="#F43F5E" stroke="#F43F5E" stroke-width="2" />
    <path d="M 248 316 Q 256 324 264 316" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- Шапочка кудряшек на голове (Шевелюра) -->
    <g filter="url(#small-shadow)">
      <path d="
        M 210 215 
        A 22 22 0 0 1 256 195 
        A 22 22 0 0 1 302 215 
        A 20 20 0 0 1 280 238 
        A 20 20 0 0 1 230 238 Z" 
        fill="#FFFFFF" 
        stroke="#000000" 
        stroke-width="7" 
        stroke-linejoin="round" 
      />
    </g>

    <!-- Аксессуар: Золотая корона набекрень (Символ Султанского Калыма) -->
    <g transform="translate(245, 130) rotate(14)" filter="url(#small-shadow)">
      <path d="M 0 40 L 10 10 L 25 28 L 45 5 L 65 28 L 80 10 L 90 40 Z" fill="#FACC15" stroke="#000000" stroke-width="6" stroke-linejoin="round" />
      <circle cx="10" cy="10" r="4" fill="#F43F5E" />
      <circle cx="45" cy="5" r="4" fill="#22D3EE" />
      <circle cx="80" cy="10" r="4" fill="#F43F5E" />
    </g>

    <!-- Брутальный бейдж: «100 🐑» внизу персонажа -->
    <g transform="translate(176, 385)" filter="url(#small-shadow)">
      <rect width="160" height="42" rx="8" fill="#FDE047" stroke="#000000" stroke-width="6" />
      <text x="80" y="28" font-family="'Unbounded', 'Impact', sans-serif" font-size="20" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">100 🐑 VIP</text>
    </g>
  </g>
</svg>
